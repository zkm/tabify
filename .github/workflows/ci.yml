name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check (HTML, CSS, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Only this repo's own files; vendored jQuery is left alone.
      - name: JavaScript parses
        run: for f in jquery.tabify.js; do node --check "$f"; done

      # No style rules, so only CSS syntax errors fail the build.
      - name: CSS parses
        run: |
          echo '{"rules":{}}' > "$RUNNER_TEMP/stylelint.json"
          npx --yes stylelint@16 --config "$RUNNER_TEMP/stylelint.json" tabify.css

      - name: HTML is well-formed
        run: npx --yes htmlhint@1 index.html
